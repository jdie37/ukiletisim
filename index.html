<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UK İletişim — Talent Agency</title>
  <meta name="description" content="UK İletişim is a premier talent agency representing exceptional actors and personalities across Turkey." />
  <meta name="theme-color" content="#03070f" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ── Header ── -->
  <header class="header">
    <div class="header-content">
      <a class="logo" href="index.html">
        <span class="logo-uk">UK</span>
        <span class="logo-full">İLETİŞİM</span>
        <span class="logo-divider"></span>
        <span class="logo-sub">Talent Agency</span>
      </a>
    </div>
  </header>

  <!-- ── Main Content ── -->
  <main class="main">

    <!-- Search -->
    <div class="search-container">
      <div class="search-wrapper">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input
          id="searchInput"
          type="search"
          class="search-input"
          placeholder="Search talents by name..."
          aria-label="Search talents"
        />
      </div>
    </div>

    <!-- Section Header -->
    <div class="section-header">
      <h1 class="section-title">Our Talents</h1>
      <span class="talent-count" id="talentCount"></span>
    </div>

    <!-- Talent Grid -->
    <div class="grid" id="talentsGrid" role="list" aria-label="Talent profiles">
      <!-- Cards are injected by app.js -->
    </div>

  </main>

  <!-- ── Footer ── -->
  <footer class="footer">
    <p>© 2024 <span>UK İletişim</span>. All rights reserved.</p>
  </footer>

  <script src="app.js"></script>

</body>
</html>
